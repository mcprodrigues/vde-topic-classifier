[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vde-topic-classifier"
version = "0.2.1"
description = "Calibrated topic classifier for exam questions, with no language model in the decision path."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Only needed by `vde build <artifact> --source llm`, never by `vde publish`.
llm = ["anthropic>=0.40"]
# Optional neural embedding backend for `vde build embeddings --backend st`.
neural = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
vde = "vde.__main__:main"

[tool.setuptools.packages.find]
include = ["vde*"]

[tool.setuptools.package-data]
vde = ["config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
